<h1> Volleyball </h1>

<p> • Volleyball is a team sport played by two teams of six players separated by a net. </p>

<p> • Volleyball can be played indoors or outdoors, on sand or grass, with teams of two or six players. </p>

<p> • The sport is estimated to be played by over 800 million people globally. </p>
